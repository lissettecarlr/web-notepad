<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="utf-8">
    <title>在线记事本</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/vendor/github.min.css" id="hljs-light">
    <link rel="stylesheet" href="/vendor/github-dark.min.css" id="hljs-dark" disabled>
    <script src="/vendor/marked.min.js" defer></script>
    <script src="/vendor/highlight.min.js" defer></script>
    <script src="/vendor/purify.min.js" defer></script>
    <script src="/script.js" defer></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>在线记事本</h1>
            <div class="header-buttons">
                <button id="history-toggle" class="control-btn" title="历史版本">历史</button>
                <button id="preview-toggle" class="control-btn" title="切换预览模式（编辑 / 分栏 / 预览）">预览</button>
                <button id="theme-toggle" class="control-btn" title="切换主题">
                    <span class="light-icon">深色</span>
                    <span class="dark-icon">浅色</span>
                </button>
            </div>
        </div>
        <div class="content-area">
            <div class="tabs" id="tabs">
                <button id="tab-add" class="tab-btn tab-add" title="新建笔记本">＋</button>
            </div>
            <div class="editor-container" id="editor-container">
                <textarea id="notepad" placeholder="在这里输入 Markdown 内容…（Ctrl+S 立即保存，Tab 缩进）" spellcheck="false"></textarea>
                <div id="preview" class="markdown-preview"></div>
            </div>
            <div class="status-bar">
                <span id="status"></span>
                <span id="stats"></span>
            </div>
        </div>
    </div>

    <div id="conflict-banner" class="banner" hidden>
        <span>⚠️ 这个笔记本已在别处被修改。</span>
        <button id="conflict-reload" class="control-btn">加载远端版本</button>
        <button id="conflict-overwrite" class="control-btn">用本地覆盖</button>
    </div>

    <div id="draft-banner" class="banner" hidden>
        <span>💾 检测到上次未成功保存的本地草稿。</span>
        <button id="draft-restore" class="control-btn">恢复草稿</button>
        <button id="draft-discard" class="control-btn">丢弃</button>
    </div>

    <div id="history-panel" class="side-panel" hidden>
        <div class="side-panel-header">
            <strong>历史版本</strong>
            <div class="side-panel-actions">
                <button id="history-clear" class="control-btn" title="清空全部历史">清空</button>
                <button id="history-close" class="control-btn">✕</button>
            </div>
        </div>
        <ul id="history-list"></ul>
        <div id="history-preview" class="history-preview" hidden>
            <pre id="history-content"></pre>
            <div class="history-preview-actions">
                <button id="history-restore" class="control-btn">恢复到此版本</button>
                <button id="history-delete" class="control-btn danger">删除此条</button>
            </div>
        </div>
    </div>
</body>
</html>
