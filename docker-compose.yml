services:
  web-notepad:
    image: lissettecarlr/web-notepad:latest
    # 本地构建用下面这行替代 image：
    # build: .
    ports:
      - "12345:12345"
    volumes:
      - ./notes:/app/notes
    environment:
      # 访问令牌，留空则不鉴权（仅建议内网使用）
      NOTEPAD_TOKEN: ""
      # 反向代理层数：nginx/Caddy/1Panel 一层填 "1"；Cloudflare → 1Panel 两层填 "2"；直接暴露填 "0"
      BEHIND_PROXY: "0"
      # 历史快照保留份数
      HISTORY_KEEP: "20"
      # 单篇笔记大小上限（字节）
      MAX_NOTE_BYTES: "5242880"
      # 可选：容器内运行用户，想让 notes/ 里的文件归宿主机某用户时填 `id -u` / `id -g` 的值
      # PUID: "1000"
      # PGID: "1000"
    restart: always
